name: e2b-local

services:
  simulator:
    build: .
    init: true
    restart: unless-stopped
    # Startup prepares the CLI container; only an explicit command creates usage.
    command: ["platform-simulator", "--action=idle"]
    environment:
      TZ: UTC
    volumes:
      - simulator_data:/state
      - ./docs/simulator:/scenarios:ro

  api:
    build: .
    restart: unless-stopped
    stop_grace_period: ${E2B_API_STOP_GRACE_PERIOD:-60s}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: e2b_billing
      PGUSER: e2b
      PGPASSWORD: ${E2B_POSTGRES_PASSWORD:-e2b_local_dev}
      PGSSLMODE: disable
      E2B_API_STARTUP_TIMEOUT: ${E2B_API_STARTUP_TIMEOUT:-10s}
      E2B_API_READ_HEADER_TIMEOUT: ${E2B_API_READ_HEADER_TIMEOUT:-5s}
      E2B_API_READ_TIMEOUT: ${E2B_API_READ_TIMEOUT:-15s}
      E2B_API_WRITE_TIMEOUT: ${E2B_API_WRITE_TIMEOUT:-35s}
      E2B_API_IDLE_TIMEOUT: ${E2B_API_IDLE_TIMEOUT:-90s}
      E2B_API_INGESTION_TIMEOUT: ${E2B_API_INGESTION_TIMEOUT:-10s}
      E2B_API_ROLLBACK_TIMEOUT: ${E2B_API_ROLLBACK_TIMEOUT:-5s}
      E2B_API_SHUTDOWN_TIMEOUT: ${E2B_API_SHUTDOWN_TIMEOUT:-45s}
      E2B_API_DB_MAX_CONNS: ${E2B_API_DB_MAX_CONNS:-8}
      E2B_API_DB_MIN_CONNS: ${E2B_API_DB_MIN_CONNS:-2}
      E2B_API_MAX_IN_FLIGHT_BATCHES: ${E2B_API_MAX_IN_FLIGHT_BATCHES:-32}
    ports:
      - "127.0.0.1:${E2B_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  docs:
    image: scalarapi/api-reference@sha256:720f243b22561e621bf4a87b23595ed2f7aeae366ff38be1fe68bde8ef4aaa9d
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_REFERENCE_CONFIG: |
        {
          "url": "/openapi.yaml",
          "layout": "modern",
          "theme": "default",
          "withDefaultFonts": false,
          "showDeveloperTools": "never",
          "agent": {"disabled": true},
          "metaData": {"title": "E2B Billing API Reference"}
        }
    ports:
      - "127.0.0.1:${E2B_DOCS_PORT:-8082}:8080"
    volumes:
      # Directory mounts preserve access when editors atomically replace files.
      - ./docs/api:/etc/caddy:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    command: ["billing-worker"]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    stop_grace_period: ${E2B_WORKER_STOP_GRACE_PERIOD:-10s}
    environment:
      TZ: UTC
      E2B_WORKER_POLL_INTERVAL: ${E2B_WORKER_POLL_INTERVAL:-1s}
      E2B_WORKER_BATCH_TIMEOUT: ${E2B_WORKER_BATCH_TIMEOUT:-5s}
      E2B_WORKER_SHUTDOWN_TIMEOUT: ${E2B_WORKER_SHUTDOWN_TIMEOUT:-5s}
      E2B_WORKER_HEARTBEAT_MAX_AGE: ${E2B_WORKER_HEARTBEAT_MAX_AGE:-15s}
      E2B_WORKER_HEARTBEAT_FILE: ${E2B_WORKER_HEARTBEAT_FILE:-/tmp/billing-worker-heartbeat}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: e2b_billing
      PGUSER: e2b
      PGPASSWORD: ${E2B_POSTGRES_PASSWORD:-e2b_local_dev}
      PGSSLMODE: disable
    healthcheck:
      test: ["CMD", "billing-worker", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: e2b_billing
      POSTGRES_USER: e2b
      POSTGRES_PASSWORD: ${E2B_POSTGRES_PASSWORD:-e2b_local_dev}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "127.0.0.1:${E2B_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  simulator_data:
