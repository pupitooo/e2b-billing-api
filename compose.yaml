name: e2b-local

services:
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: e2b_billing
      PGUSER: e2b
      PGPASSWORD: ${E2B_POSTGRES_PASSWORD:-e2b_local_dev}
      PGSSLMODE: disable
    ports:
      - "127.0.0.1:${E2B_API_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  docs:
    image: scalarapi/api-reference@sha256:720f243b22561e621bf4a87b23595ed2f7aeae366ff38be1fe68bde8ef4aaa9d
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_REFERENCE_CONFIG: |
        {
          "url": "/openapi.yaml",
          "layout": "modern",
          "theme": "default",
          "withDefaultFonts": false,
          "showDeveloperTools": "never",
          "agent": {"disabled": true},
          "metaData": {"title": "E2B Billing API Reference"}
        }
    ports:
      - "127.0.0.1:${E2B_DOCS_PORT:-8082}:8080"
    volumes:
      - ./docs/api/openapi.yaml:/usr/share/caddy/openapi.yaml:ro
      - ./docs/api/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: e2b_billing
      POSTGRES_USER: e2b
      POSTGRES_PASSWORD: ${E2B_POSTGRES_PASSWORD:-e2b_local_dev}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    ports:
      - "127.0.0.1:${E2B_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
