name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  tests:
    name: All tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: e2b-ci
      E2B_POSTGRES_PORT: '15432'
      E2B_API_PORT: '18081'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Go formatting, whitespace, and static analysis
        run: E2B_GO_CHECKS_DOCKER=1 make check
      - name: Validate published documentation, links, and assets
        run: make docs-check
      - name: Check static demo behavior, exact retries, and SQL links
        run: make demo-check
      - name: Check exact Adminer integer display
        run: make adminer-check
      - name: Start PostgreSQL
        run: make up SERVICE=postgres
      - name: Check SQL integrity in UTC and Asia/Shanghai
        run: make db-test
      - name: Run Go unit tests without external services
        run: make go-test
      - name: Run PostgreSQL repository and billing workflow tests
        run: make inbox-test
      - name: Run HTTP tests against the separately started API
        run: make api-test
      - name: Run worker executable lifecycle tests
        run: make _test-worker
      - name: Show service logs on failure
        if: failure()
        run: make logs
      - name: Remove containers and test data
        if: always()
        run: docker compose down --volumes --remove-orphans

  e2e:
    name: Backend E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run backend scenarios against separate application containers
        run: make e2e-test
      - name: Preserve E2E results and service generations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-evidence
          path: tools/e2e-results/
          if-no-files-found: error
