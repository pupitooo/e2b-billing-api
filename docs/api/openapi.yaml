components:
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 256
      description: |
        Preserved text containing at least one non-whitespace character, valid
        Unicode, and no NUL. The actual maximum is 256 UTF-8 bytes, including
        leading/trailing whitespace; maxLength also bounds its character count.
      allOf:
        - pattern: '^[^\u0000]*$'
        - pattern: '[^\u0009-\u000d\u0020\u0085\u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000]'
    UsageBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        batch_id:
          $ref: '#/components/schemas/Identifier'
          description: Optional producer metadata; not stored and not used for deduplication.
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/UsageEvent'
    ConsumptionTime:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'
      description: |
        Valid RFC 3339 instant with an explicit offset and at most six
        fractional digits. The corresponding UTC year must be 1000–9999.
        The minimum instant is 1000-01-01T00:00:00Z. Bounds apply after UTC
        conversion: a local year of 1000 can be invalid if its offset moves
        the instant into 0999, while a local year of 0999 can be valid if
        its offset moves the instant into 1000.
    UsageEvent:
      type: object
      additionalProperties: false
      description: |
        Measured increment over [period_start, period_end). The end must follow
        the start as an instant. Fields must be explicit and non-null. Units
        are neither a cumulative counter nor a monetary amount.
      required: [source, event_id, schema_version, customer_id, sandbox_id, metric, period_start, period_end, units]
      properties:
        source:
          $ref: '#/components/schemas/Identifier'
          description: Stable producer namespace preserved across restarts and retries.
        event_id:
          $ref: '#/components/schemas/Identifier'
          description: Identity unique within source; preserved with content on retries.
        schema_version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Positive contract version encoded as an integer token.
        customer_id:
          $ref: '#/components/schemas/Identifier'
        sandbox_id:
          $ref: '#/components/schemas/Identifier'
        metric:
          $ref: '#/components/schemas/Identifier'
          description: >-
            Resource identifier retained without a catalog foreign key at receipt.
            The accounting worker selects historical prices from the metric catalog;
            missing valid prices quarantine usage without financial effects.
        period_start:
          $ref: '#/components/schemas/ConsumptionTime'
          description: Inclusive start of consumption.
        period_end:
          $ref: '#/components/schemas/ConsumptionTime'
          description: Exclusive end; must be later than period_start.
        units:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Explicit increment encoded as an integer token; zero is valid.
    AcceptedResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
          description: Durable inbox receipt; accounting is asynchronous.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_json, invalid_batch, request_too_large, unsupported_media_type, event_conflict, inbox_unavailable]
            message:
              type: string
              description: Human-readable description; clients should use code for classification.
            field:
              type: string
              description: Optional location, such as events[0].units.
            source:
              $ref: '#/components/schemas/Identifier'
              description: Producer namespace of a conflicting event; present on 409.
            event_id:
              $ref: '#/components/schemas/Identifier'
              description: Conflicting identity within source; present on 409.
    ConflictResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - properties:
            error:
              required: [source, event_id]
              properties:
                code:
                  const: event_conflict

    BillingError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - invalid_json
              - invalid_command
              - not_found
              - billing_conflict
              - billing_unavailable
              - unsupported_media_type
            message:
              type: string
            field:
              type: string

    PriceVersion:
      type: object
      additionalProperties: false
      required:
      - price_version_id
      - customer_id
      - metric
      - price_per_million_cents
      - effective_from
      properties:
        price_version_id:
          $ref: '#/components/schemas/Identifier'
        customer_id:
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        metric:
          $ref: '#/components/schemas/Identifier'
        price_per_million_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        effective_from:
          $ref: '#/components/schemas/ConsumptionTime'
          description: Required finite effective instant. New HTTP versions must start at or after the server
            insertion instant sampled under the catalog lock. Equality is valid. Identical retries
            remain valid after activation. No null or undated baseline is supported; provision
            the price before the first consumption time it must cover.

    CreditGrant:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - amount_cents
      - recorded_at
      properties:
        operation_id:
          $ref: '#/components/schemas/Identifier'
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        recorded_at:
          $ref: '#/components/schemas/ConsumptionTime'

    CreditSnapshot:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - credit_balance_ticks
      - state_version
      - pending_events
      - processing_errors
      properties:
        customer_id:
          $ref: '#/components/schemas/Identifier'
        credit_balance_ticks:
          type: string
          pattern: ^[0-9]+$
          description: Exact nonnegative ticks; one cent is 1000000 ticks.
        state_version:
          type: integer
          format: int64
          minimum: 0
        pending_events:
          type: integer
          format: int64
          minimum: 0
        processing_errors:
          type: integer
          format: int64
          minimum: 0
          description: Quarantined receipt count, including P0 missing_valid_price catalog incidents.

    AddonPurchase:
      type: object
      additionalProperties: false
      required:
      - subscription_id
      - addon_name
      - purchased_at
      properties:
        subscription_id:
          $ref: '#/components/schemas/Identifier'
        addon_name:
          $ref: '#/components/schemas/Identifier'
        purchased_at:
          $ref: '#/components/schemas/ConsumptionTime'

    Subscription:
      type: object
      additionalProperties: false
      required:
      - subscription_id
      - customer_id
      - addon_name
      - monthly_price_cents
      - purchased_at
      - start_month
      properties:
        subscription_id:
          $ref: '#/components/schemas/Identifier'
        customer_id:
          $ref: '#/components/schemas/Identifier'
        addon_name:
          $ref: '#/components/schemas/Identifier'
        monthly_price_cents:
          type: integer
          format: int64
          minimum: 0
        purchased_at:
          $ref: '#/components/schemas/ConsumptionTime'
        start_month:
          type: string
          format: date
          description: First date of the UTC purchase month.

    BillingMonth:
      type: string
      pattern: ^[1-9][0-9]{3}-(0[1-9]|1[0-2])$
      example: 2026-10
      description: Canonical UTC calendar month; years 1000 through 9999.

    SpendLimitChange:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - limit_cents
      properties:
        operation_id:
          $ref: '#/components/schemas/Identifier'
        limit_cents:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
          maximum: 9223372036854775807

    LimitStatus:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - month
      - limit_cents
      - gross_charge_ticks
      - limit_reached
      - state_version
      - pending_events
      - processing_errors
      properties:
        customer_id:
          $ref: '#/components/schemas/Identifier'
        month:
          $ref: '#/components/schemas/BillingMonth'
        limit_cents:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        gross_charge_ticks:
          type: string
          pattern: ^[0-9]+$
        limit_reached:
          type: boolean
        state_version:
          type: integer
          format: int64
          minimum: 0
        pending_events:
          type: integer
          format: int64
          minimum: 0
        processing_errors:
          type: integer
          format: int64
          minimum: 0
          description: Quarantined receipt count, including P0 missing_valid_price catalog incidents.

    InvoiceLine:
      type: object
      additionalProperties: false
      required:
      - kind
      - description
      - amount_cents
      properties:
        kind:
          type: string
          enum:
          - usage
          - addon
          - credit
        description:
          type: string
        amount_cents:
          type: integer
          format: int64
        price_version_id:
          $ref: '#/components/schemas/Identifier'
        metric:
          $ref: '#/components/schemas/Identifier'
        usage_month:
          $ref: '#/components/schemas/BillingMonth'
        units:
          type: string
          pattern: ^[0-9]+$
        gross_ticks:
          type: string
          pattern: ^[0-9]+$
        credit_ticks:
          type: string
          pattern: ^[0-9]+$
        subscription_id:
          $ref: '#/components/schemas/Identifier'

    Invoice:
      type: object
      additionalProperties: false
      required:
      - customer_id
      - number
      - month
      - customer_name
      - country
      - billing_address
      - currency
      - lines
      - total_cents
      - gross_usage_ticks
      - credit_used_ticks
      - issued_at
      properties:
        customer_id:
          $ref: '#/components/schemas/Identifier'
        number:
          type: string
        month:
          $ref: '#/components/schemas/BillingMonth'
        customer_name:
          type: string
        country:
          type: string
        billing_address:
          type: string
        currency:
          type: string
          const: USD
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
        total_cents:
          type: integer
          format: int64
          minimum: 0
        gross_usage_ticks:
          type: string
          pattern: ^[0-9]+$
        credit_used_ticks:
          type: string
          pattern: ^[0-9]+$
        issued_at:
          $ref: '#/components/schemas/ConsumptionTime'

    InvoiceMonth:
      type: object
      additionalProperties: false
      required:
      - month
      properties:
        month:
          $ref: '#/components/schemas/BillingMonth'
          description: For a new closure, the whole UTC calendar month must have ended according to the
            server clock. An already issued invoice remains available on an identical retry.
