  /customers/{customer_id}/limit-status:
    get:
      operationId: getCurrentLimitStatus
      tags:
      - Customers
      summary: Get current month limit status
      description: |
        Check processed usage against the limit for the current UTC month, before credit and excluding add-ons.
        Pending/error counts indicate accounting freshness; the caller enforces the limit.
        See [limit rules](/architecture/accounting-rules/#utc-months-limits-add-ons-and-late-usage).
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Current UTC month usage, limit status, and accounting freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitStatus'
              example:
                customer_id: cyberdyne
                month: 2026-10
                limit_cents: 1500
                gross_charge_ticks: '1817283945'
                limit_reached: true
                state_version: 3
                pending_events: 0
                processing_errors: 0
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '422':
          description: Invalid customer identifier.
          content:
