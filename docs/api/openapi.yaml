openapi: 3.1.2
info:
  title: E2B Billing API
  version: 0.5.0
  description: |
    Receive sandbox usage, manage prices, credit and spend limits, and issue monthly invoices.
    All implemented routes are registered together; the API requires storage at startup.
    Storage failures after startup return the documented retryable responses.
    Business timestamps and current-month decisions use the shared application clock.
    E2B_DEMO_NOW selects fixed demo time at process startup; unset uses real time.
    HTTP requests cannot set or advance that clock. The static portal publishes
    startup metadata separately at /demo/runtime.json.
    See the [API guide](/guides/api-reference/) for request and retry rules.

    ## API endpoints and callers

    [![Implemented API endpoints and callers](/reference/diagrams/api-endpoints/api-endpoints.png)](/reference/diagrams/api-endpoints/api-endpoints.png)

    [Diagram guide and Mermaid source](/guides/api-reference/#api-endpoints-and-callers)
servers:
  - url: /api
    description: Same-origin API proxy provided by the local Scalar service
tags:
  - name: Customers
    description: Customer credit, add-ons, spend limits, and invoices under /customers
  - name: Prices
    description: Default and customer-specific price versions under /prices
  - name: Usage
    description: Measurements supplied by the sandbox platform
  - name: Demo runtime
    description: Startup metadata served by the static docs portal, outside the Go API
  - name: Healthz
    description: HTTP server availability
paths:
  /demo/runtime.json:
    servers:
      - url: /
        description: Docs portal origin; this route does not use the /api proxy
    get:
      operationId: getDemoRuntime
      tags: [Demo runtime]
      summary: Read demo clock configuration
      x-implementation-status: implemented
      description: |
        The docs service creates this JSON file at startup from E2B_DEMO_NOW,
        using the same Compose configuration as API and worker. It describes
        configuration, not a live reading or a cross-process health check.
        Fixed time stays constant until the processes are recreated. In real
        mode the GUI uses advisory browser time; the API decides month eligibility.
        Reload metadata after changing the environment and recreating all three services.
      responses:
        '200':
          description: Real or fixed clock configuration, without database access.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [clock_mode]
                    properties:
                      clock_mode:
                        const: real
                  - type: object
                    additionalProperties: false
                    required: [clock_mode, fixed_now]
                    properties:
                      clock_mode:
                        const: fixed
                      fixed_now:
                        type: string
                        format: date-time
                        description: Configured RFC3339 instant; Go validates UTC years 1000 through 9999 and microsecond precision.
              examples:
                real:
                  value:
                    clock_mode: real
                fixed:
                  value:
                    clock_mode: fixed
                    fixed_now: '2026-11-01T00:00:00Z'
  /usage/batches:
    post:
      operationId: postUsageBatches
      tags: [Usage]
      summary: Submit usage batch
      x-implementation-status: implemented
      description: |
        Store a usage batch atomically for asynchronous accounting.
        Identical `(source, event_id)` retries succeed; changed content rejects the whole batch.
        See [usage requests and retries](/guides/api-reference/#usage-requests).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageBatch'
            examples:
              acmeUsage:
                summary: First Acme measurement from the assignment
                value:
                  events:
                    - source: platform-simulator
                      event_id: acme-cpu-000001
                      schema_version: 1
                      customer_id: acme
                      sandbox_id: acme-sandbox-001
                      metric: cpu_seconds
                      period_start: '2026-10-10T12:00:00Z'
                      period_end: '2026-10-10T13:00:00Z'
                      units: 100000000
      responses:
        '202':
          description: The whole batch is durably received; accounting is asynchronous.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              example:
                status: accepted
        '400':
          description: Invalid or ambiguous JSON. No events accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_json
                  message: The object contains a duplicate field.
                  field: events[0]
        '413':
          description: Body exceeds 1_048_576 bytes. Split the batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: request_too_large
                  message: The request body must not exceed 1048576 bytes.
        '415':
          description: Use uncompressed application/json with optional UTF-8 charset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unsupported_media_type
                  message: Use application/json with UTF-8 encoding.
        '422':
          description: Missing or invalid measurement values. No events accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInterval:
                  value:
                    error:
                      code: invalid_batch
                      message: must be later than period_start
                      field: events[0].period_end
                unsupportedUTCYear:
                  value:
                    error:
                      code: invalid_batch
                      message: must have a UTC year between 1000 and 9999
                      field: events[0].period_start
        '409':
          description: Changed content for a (source, event_id). No events accepted; investigate the conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
              example:
                error:
                  code: event_conflict
                  message: The event identity already has different measurement content.
                  source: platform-simulator
                  event_id: acme-cpu-000001
        '503':
          description: Admission or storage unavailable. Outcome may be unknown; retry unchanged events after Retry-After.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: inbox_unavailable
                  message: Inbox storage is unavailable. Retry the same event identities and content.
  /prices:
    post:
      operationId: createPriceVersion
      tags:
      - Prices
      summary: Add price version
      description: |
        Add an immutable default or customer-specific price effective from a UTC calendar date.
        Supply effective_from as YYYY-MM-DD (years 1000 through 9999); timestamps and null are rejected.
        The backend stores 00:00:00 UTC on that date and returns the date in the response.
        A new date must be today or later, checked after acquiring the catalog lock.
        Today's date is allowed only if already rated history is preserved; conflicts return 409.
        Supply idempotency_key in the JSON body; billing generates price_version_id.
        Keys are scoped to this endpoint and successful results are retained indefinitely.
        Unchanged retries retain the original price even after activation; changed
        customer, metric, amount, or date returns 409. Failed commands reserve no key.
        Missing, null, or invalid string keys return 422. Duplicate or unknown fields
        and wrong types return 400. Omitting effective_from returns 422.
        See [price insertion contract](/architecture/accounting-rules/#price-insertion-contract).
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceVersionRequest'
            examples:
              scheduled:
                summary: Schedule a future price
                value:
                  idempotency_key: cpu-default-december
                  customer_id: null
                  metric: cpu_seconds
                  price_per_million_cents: 7
                  effective_from: '2026-12-01'
              daily:
                summary: Start on a calendar date
                value:
                  idempotency_key: cpu-default-daily
                  customer_id: null
                  metric: cpu_seconds
                  price_per_million_cents: 7
                  effective_from: '2026-11-01'
      responses:
        '200':
          description: Price version stored, or original version returned on an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceVersion'
              example:
                price_version_id: price_example_december
                customer_id: null
                metric: cpu_seconds
                price_per_million_cents: 7
                effective_from: '2026-12-01'
        '400':
          description: Invalid or ambiguous JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '409':
          description: Price identity, effective date, or rated history conflicts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_conflict
                  message: Operation identity has different content, financial history conflicts, or closing
                    is blocked.
        '413':
          description: Body exceeds 65_536 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Command body exceeds 65536 bytes.
        '415':
          description: Use uncompressed application/json with optional UTF-8 charset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: unsupported_media_type
                  message: Use uncompressed application/json with optional UTF-8 charset.
        '422':
          description: Invalid price values or backdated effective_from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  message: A new price must not start before the current UTC date.
                  field: effective_from
        '503':
          description: Storage unavailable. Outcome may be unknown; retry unchanged command after Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_unavailable
                  message: Database deadline or storage failure. Retry unchanged operation identity and
                    content; outcome may be unknown.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
  /customers/{customer_id}/credits:
    post:
      operationId: grantCredit
      tags:
      - Customers
      summary: Grant credit
      description: |
        Grant credit for usage charges immediately; add-ons are excluded.
        The backend records the grant audit timestamp; no caller timestamp is accepted or returned.
        See [credit allocation](/architecture/usage-to-invoice/#6-credits-gross-charge-allocated-credit-and-balance).
        Supply idempotency_key in the JSON body; keys are scoped to this customer and endpoint.
        Unchanged retries return the original command result; changed content returns 409.
        Missing, null, or invalid string keys return 422. Duplicate fields or wrong key types return 400.
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditGrant'
            example: &creditGrantExample
              idempotency_key: welcome-acme
              amount_cents: 2500
      responses:
        '200':
          description: Credit granted, or original grant returned on an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditGrant'
              example: *creditGrantExample
        '400':
          description: Invalid or ambiguous JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '409':
          description: Operation identity already has different grant content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_conflict
                  message: Operation identity has different content, financial history conflicts, or closing
                    is blocked.
        '413':
          description: Body exceeds 65_536 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Command body exceeds 65536 bytes.
        '415':
          description: Use uncompressed application/json with optional UTF-8 charset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: unsupported_media_type
                  message: Use uncompressed application/json with optional UTF-8 charset.
        '422':
          description: Missing or invalid command values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  message: Explicit required field or value is invalid.
        '503':
          description: Storage unavailable. Outcome may be unknown; retry unchanged command after Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_unavailable
                  message: Database deadline or storage failure. Retry unchanged operation identity and
                    content; outcome may be unknown.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
  /customers/{customer_id}/credit:
    get:
      operationId: getCredit
      tags:
      - Customers
      summary: Get credit balance
      description: |
        Read the exact remaining credit and pending/error receipt counts.
        The balance reflects processed usage. See [credit allocation](/architecture/usage-to-invoice/#6-credits-gross-charge-allocated-credit-and-balance).
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Current credit balance and accounting status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditSnapshot'
              example:
                customer_id: acme
                credit_balance_ticks: '1300000000'
                state_version: 3
                pending_events: 0
                processing_errors: 0
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '422':
          description: Invalid customer identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  message: Use nonblank Unicode without NUL, at most 256 UTF-8 bytes.
                  field: customer_id
        '503':
          description: Storage unavailable. Retry the read after Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_unavailable
                  message: Database deadline or storage failure. Retry unchanged operation identity and
                    content; outcome may be unknown.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
  /customers/{customer_id}/addons:
    post:
      operationId: purchaseAddon
      tags:
      - Customers
      summary: Purchase add-on
      description: |
        Start a recurring add-on at its current catalog price, charged in full from the purchase month.
        Supply purchased_at as YYYY-MM-DD (years 1000 through 9999); timestamps and null are rejected.
        The backend stores midnight UTC on that date and returns the date.
        Historical dates in open months and future dates are allowed. A date in or before a
        closing or closed month conflicts. Unchanged retries preserve the original result.
        Supply idempotency_key in the JSON body; billing derives subscription_id from the customer and add-on name.
        Keys are scoped to this endpoint and customer. Successful results are retained
        indefinitely in PostgreSQL, atomically with the purchase. An unchanged retry
        returns the original subscription even after catalog changes or invoice closing.
        Changed add-on or purchase time under the same key returns 409. Failed commands
        reserve no key. Missing, null, or invalid string keys return 422. Duplicate fields or wrong key types return 400.
        See [add-on billing rules](/architecture/accounting-rules/#utc-months-limits-add-ons-and-late-usage).
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonPurchase'
            example:
              idempotency_key: acme-concurrency
              addon_name: concurrency_pack
              purchased_at: '2026-10-05'
      responses:
        '200':
          description: Subscription created, or original subscription returned on an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              example:
                subscription_id: subscription/acme/concurrency_pack
                customer_id: acme
                addon_name: concurrency_pack
                monthly_price_cents: 2000
                purchased_at: '2026-10-05'
                start_month: '2026-10-01'
        '400':
          description: Invalid or ambiguous JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
        '404':
          description: Customer or add-on does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '409':
          description: Subscription conflicts or purchase month is already closing or closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_conflict
                  message: Operation identity has different content, financial history conflicts, or closing
                    is blocked.
        '413':
          description: Body exceeds 65_536 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Command body exceeds 65536 bytes.
        '415':
          description: Use uncompressed application/json with optional UTF-8 charset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: unsupported_media_type
                  message: Use uncompressed application/json with optional UTF-8 charset.
        '422':
          description: Missing or invalid command values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  message: Explicit required field or value is invalid.
        '503':
          description: Storage unavailable. Outcome may be unknown; retry unchanged command after Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_unavailable
                  message: Database deadline or storage failure. Retry unchanged operation identity and
                    content; outcome may be unknown.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
