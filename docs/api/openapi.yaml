  /customers/{customer_id}/credit:
    get:
      operationId: getCredit
      tags:
      - Billing
      summary: Read exact remaining credit
      description: 'Return a single database snapshot of exact balance, account version, and committed pending/error
        receipt counts. Receipt acceptance is asynchronous: pending_events can be positive after 202. Investigate
        processing_errors instead of assuming all accepted input was accounted for. No cent rounding changes
        the balance.'
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Committed result or current snapshot. Identical command retries succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditSnapshot'
              example:
                customer_id: acme
                credit_balance_ticks: '1300000000'
                state_version: 3
                pending_events: 0
                processing_errors: 0
        '404':
          description: Customer or catalog resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '422':
          description: Invalid customer identifier or UTC month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  message: Use nonblank Unicode without NUL, at most 256 UTF-8 bytes.
                  field: customer_id
        '503':
          description: Database deadline or storage failure. Retry unchanged operation identity and content;
            outcome may be unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_unavailable
                  message: Database deadline or storage failure. Retry unchanged operation identity and
                    content; outcome may be unknown.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
  /customers/{customer_id}/addons:
    post:
      operationId: purchaseAddon
      tags:
      - Billing
      summary: Purchase a recurring monthly add-on
      description: Snapshot the catalog monthly price at purchase. Bill its full price from the UTC purchase
        month onward, including month-end purchases. Credit never pays add-ons. One subscription per customer/add-on
        is supported; quantities, cancellation, and proration are outside the assignment. Reuse subscription_id
        and unchanged content after a lost response. Changed content or a second identity for an existing
        subscription returns 409. A new purchase cannot start at or before an already closing or closed month; retry
        of an existing purchase still succeeds.
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonPurchase'
            example:
              subscription_id: acme-concurrency
              addon_name: concurrency_pack
              purchased_at: '2026-10-05T00:00:00Z'
      responses:
        '200':
          description: Committed result or current snapshot. Identical command retries succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
              example:
                subscription_id: acme-concurrency
                customer_id: acme
                addon_name: concurrency_pack
                monthly_price_cents: 2000
                purchased_at: '2026-10-05T00:00:00Z'
                start_month: '2026-10-01'
        '400':
          description: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
