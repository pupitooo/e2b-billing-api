        Set the monthly usage spend limit immediately, or use `null` to remove it.
        See [limit rules](/architecture/accounting-rules/#utc-months-limits-add-ons-and-late-usage)
        and [command retries](/guides/api-reference/#command-retries).
        Supply idempotency_key in the JSON body; keys are scoped to this customer and endpoint.
        Unchanged retries return the original command result; changed content returns 409.
        Missing, null, or invalid string keys return 422. Duplicate fields or wrong key types return 400.
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendLimitChange'
            example:
              idempotency_key: october-limit
              limit_cents: 1500
      responses:
        '200':
          description: Limit updated, or original command result returned without changing newer configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendLimitChange'
              example:
                idempotency_key: october-limit
                limit_cents: 1500
        '400':
          description: Invalid or ambiguous JSON.
          content:
