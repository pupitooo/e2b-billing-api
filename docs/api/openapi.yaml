openapi: 3.1.2
info:
  title: E2B Billing API
  version: 0.5.0
  description: |
    The usage endpoint validates and atomically commits measurements to the
    PostgreSQL inbox before returning 202. Identical event retries succeed
    without changing stored receipt or accounting state; changed content
    conflicts. Acceptance confirms durable receipt, while accounting remains
    asynchronous in the standalone worker. Unsupported customers, schemas,
    metrics, or crossing intervals are retained with a processing error.
    A missing valid price at consumption time is a P0 catalog incident:
    the receipt retains P0 missing_valid_price and produces no financial effect.
servers:
  - url: /api
    description: Same-origin API proxy provided by the local Scalar service
tags:
  - name: Billing
    description: Financial commands and customer projections
  - name: Usage
    description: Measurements supplied by the sandbox platform
  - name: Health
    description: HTTP server availability
paths:
  /usage/batches:
    post:
      operationId: postUsageBatches
      tags: [Usage]
      summary: Commit a usage batch to the inbox
      x-implementation-status: implemented
      description: |
        Parse one uncompressed UTF-8 JSON document, validate its envelope and
        every measurement, and commit the whole batch in one inbox transaction.
        Return 202 only after a successful synchronous PostgreSQL commit.

        The body is limited to 1048576 bytes and 1–1000 events. Member names are
        case-sensitive; unknown and duplicate members, malformed UTF-8, and
        unpaired UTF-16 escapes are rejected. Identifiers and an optional
        batch_id are limited to 256 UTF-8 bytes each. Required event fields must
        be explicitly supplied and non-null, including units when its value is
        zero. Version and units use integer tokens without fractional or
        exponent notation; decoding outside int32/int64 ranges returns 400.

        Timestamps use RFC 3339 with an explicit offset, valid calendar values,
        UTC years 1000–9999, and at most six fractional digits. Interval ordering
        compares instants. Identifiers are preserved; instants normalize to UTC.
        Positive schema versions and nonblank metrics are structurally accepted;
        customer existence, schema version 1, and historical prices are checked
        asynchronously by the accounting worker. A receipt must fit one UTC
        month and one applicable price version; unsupported input is retained
        with processing_error and contributes no financial effect.
        Provision each metric's dated price before generating its first usage.
        A missing valid price sets P0 missing_valid_price in processing_error;
        after commit, accounting logs priority=P0 with the receipt identity,
        customer, metric, and original consumption time. Repair the historical price through controlled SQL
        and explicitly release the investigated receipt to resume accounting.
        Adding a price or retrying this endpoint does not clear that error.

        Identify measurements by (source, event_id) and accept a whole batch
        atomically, including repeated identities within the incoming batch.
        Identical content succeeds across retries and batch boundaries without
        another insert or a changed received_at. Changed measurement content
        for an existing identity returns 409 and rolls back new events in the
        batch. Billing supplies the first received_at from its UTC clock.
        Compare schema_version, customer_id, sandbox_id, metric, period_start,
        period_end, and units as domain values; timestamp offsets representing
        the same instant are identical. Reordered events and different batch
        boundaries do not change event identity. Batch identifiers are optional
        producer metadata, are not stored, and do not participate in comparison.
        Accounting remains asynchronous and is not implied by acceptance.

        Admission is bounded per API instance (32 concurrent batches by
        default). When full, return 503 before application body parsing;
        retain the original events for retry. Database work, including waiting
        for a pool connection, has a configurable deadline (10 seconds by
        default), also honoring request cancellation. Admission exhaustion,
        unavailable storage, or a failed commit returns 503 with
        Retry-After: 1. A 503 or a lost response can leave the commit outcome
        unknown: retain events and retry the same identities and content after
        backoff. Identical retries are safe even after successful accounting.
        A 409 requires investigation; unchanged retries cannot resolve it.
      requestBody:
        required: true
        description: A nonempty batch of explicit measurement values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageBatch'
            examples:
              acmeUsage:
                summary: First Acme measurement from the assignment
                value:
                  batch_id: acme-batch-000001
                  events:
                    - source: platform-simulator
                      event_id: acme-cpu-000001
                      schema_version: 1
                      customer_id: acme
                      sandbox_id: acme-sandbox-001
                      metric: cpu_seconds
                      period_start: '2026-10-10T12:00:00Z'
                      period_end: '2026-10-10T13:00:00Z'
                      units: 100000000
      responses:
        '202':
          description: |
            Every new measurement is durably committed; existing identical
            measurements are preserved, including their original received_at,
            processed_at, and processing_error. No partial batch is accepted.
            Accounting completion is not implied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              example:
                status: accepted
        '400':
          description: |
            Malformed or ambiguous JSON, incorrect JSON types, or numeric
            tokens outside the representable int32/int64 ranges. No batch is
            accepted. Correct the request before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_json
                  message: The object contains a duplicate field.
                  field: events[0]
        '413':
          description: The body exceeds 1048576 bytes. Split the batch before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: request_too_large
                  message: The request body must not exceed 1048576 bytes.
        '415':
          description: |
            Content-Type must be application/json with optional UTF-8 charset.
            Content-Encoding must be omitted or identity; compression is not
            supported. Correct the headers and encoding before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unsupported_media_type
                  message: Use application/json with UTF-8 encoding.
        '422':
          description: |
            A required field is absent/null or a value violates the batch or
            measurement contract. No partial batch is accepted. Correct the
            reported value before retrying; zero units must be explicit.
            An instant whose UTC year is outside 1000–9999 is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInterval:
                  value:
                    error:
                      code: invalid_batch
                      message: must be later than period_start
                      field: events[0].period_end
                unsupportedUTCYear:
                  value:
                    error:
                      code: invalid_batch
                      message: must have a UTC year between 1000 and 9999
                      field: events[0].period_start
        '409':
          description: |
            Different measurement content for one (source, event_id), either
            already stored or repeated inside this request. Original rows are
            preserved and every new row in the batch is rolled back. The
            response identifies the conflicting key, without exposing its
            stored content. Retain the input for investigation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
              example:
                error:
                  code: event_conflict
                  message: The event identity already has different measurement content.
                  source: platform-simulator
                  event_id: acme-cpu-000001
        '503':
          description: |
            The API's concurrent batch budget is exhausted, or inbox storage is
            unavailable, timed out, canceled, or failed during commit, including
            a missing schema before explicit migrations. Admission rejection
            happens before application body parsing and writes no events. The
            commit outcome may be unknown. Retain events and retry unchanged
            identities/content after backoff; storage details are not exposed.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying; value is 1.
              schema:
                type: string
                const: '1'
              example: '1'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: inbox_unavailable
                  message: Inbox storage is unavailable. Retry the same event identities and content.
  /prices:
    post:
      operationId: createPriceVersion
      tags:
      - Billing
      summary: Append an immutable price version
      description: Append a default (null customer_id) or customer override. Consumption time selects the
        latest eligible override before falling back to default. Reuse price_version_id with identical content
        after a lost response. Changed identity content, a duplicate effective instant, or a change invalidating
        any already rated receipt returns 409. A new effective_from before the server insertion instant
        returns 422 with invalid_command and field effective_from, even without rated history.
        The server samples this instant after acquiring the catalog lock. Equality is accepted;
        scheduling in the future is supported. Identical retries bypass this time check after activation.
        Commands are serialized against rating under a catalog advisory lock. The reference implementation
        scans affected rated history; this is not a demonstrated large-volume administrative path. Every
        field is explicit; timestamps normalize to UTC. effective_from is required and non-null;
        there is no undated baseline. Provision an applicable price before the metric's first usage.
        Historical seed data and investigated missing-price repairs use controlled operator SQL,
        preserving rated history; they do not bypass this restriction through the HTTP API. This command
        does not automatically clear usage processing errors.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceVersion'
            example: &id001
              price_version_id: cpu-default-december
              customer_id: null
              metric: cpu_seconds
              price_per_million_cents: 7
              effective_from: '2026-12-01T00:00:00Z'
      responses:
        '200':
          description: Committed result or current snapshot. Identical command retries succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceVersion'
              example: *id001
        '400':
          description: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
        '404':
          description: Customer or catalog resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '409':
          description: Operation identity has different content, financial history conflicts, or closing
            is blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_conflict
                  message: Operation identity has different content, financial history conflicts, or closing
                    is blocked.
        '413':
          description: Command body exceeds 65536 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Command body exceeds 65536 bytes.
        '415':
          description: Use uncompressed application/json with optional UTF-8 charset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: unsupported_media_type
                  message: Use uncompressed application/json with optional UTF-8 charset.
        '422':
          description: Explicit required field or value is invalid, including backdated effective_from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  message: A new price must not start before its insertion time.
                  field: effective_from
        '503':
          description: Database deadline or storage failure. Retry unchanged operation identity and content;
            outcome may be unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_unavailable
                  message: Database deadline or storage failure. Retry unchanged operation identity and
                    content; outcome may be unknown.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
  /customers/{customer_id}/credits:
    post:
      operationId: grantCredit
      tags:
      - Billing
      summary: Grant usage-only credit
      description: E2B grants positive whole cents, persisted as exact ticks. Reuse operation_id and all
        content on retry; changed amount or recorded_at returns 409. Grants serialize with usage accounting,
        apply immediately, and never rewrite earlier allocations. recorded_at is explicit audit metadata;
        it is not a scheduled activation time. Customers do not buy credit in this assignment. No authentication
        layer is included in the assignment.
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditGrant'
            example: &creditGrantExample
              operation_id: welcome-acme
              amount_cents: 2500
              recorded_at: '2026-10-01T00:00:00Z'
      responses:
        '200':
          description: Committed result or current snapshot. Identical command retries succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditGrant'
              example: *creditGrantExample
        '400':
          description: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
          content:
