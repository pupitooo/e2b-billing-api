  /customers/{customer_id}/invoices:
    post:
      operationId: issueMonthlyInvoice
      tags:
      - Billing
      summary: Close a UTC month and issue its immutable invoice
      description: >-
        The fixed billing period is a whole UTC calendar month, with one immutable invoice per
        customer/month. The request accepts only a YYYY-MM month, with no closing-day or usage-cutoff parameter.
        A new closure requires server UTC time at or after the first instant of the following month.
        Ongoing or future months return 422 with invalid_command and field month before any financial changes.
        January becomes eligible exactly at 00:00:00Z on 1 February. Closing uses one transaction and the
        customer account lock. Only usage accounting committed before acquisition of that lock is included
        through rated_usage_groups. Closing never processes pending usage or waits for the inbox to drain.
        Pending and quarantined usage in the target month do not block valid chronological issuance, even
        if accepted before the closing request.
        An in-flight worker holding the account lock must finish before closing acquires it. Workers
        acquiring the lock after the committed closure preserve an original month later than the latest
        closure. Usage from the latest closed month or an earlier month routes strictly after that closure
        and at or after its receipt month, including skipped earlier empty months. Retain historical prices and original-month
        gross spend. Separate billing groups have separate rounding boundaries. Snapshot buyer details,
        freeze groups, store the closed month and invoice, and advance the customer-specific number and
        state version atomically. A pre-commit failure rolls back the entire closing attempt; a retry
        can include newly processed groups. A lost committed response is resolved by the same customer/month
        identity: retry returns the original immutable snapshot and never consumes credit again. Storage
        deadlines return 503 when a response can be delivered. A first invoice cannot skip an earlier original
        usage month already present in usage_inbox or earlier unclosed rated groups. This indexed existence
        check does not process usage. Each subsequent new invoice requires the immediately preceding month
        closed. Missing predecessors, skipped earlier data or incompatible closed history return 409 without
        financial effects. Empty months are supported; no separate first-month configuration is required.
        An operator invokes closing explicitly; scheduling and document delivery are not implemented.
        USD group presentation uses cumulative half-up cents and an aggregate credit line derived from
        rounded gross minus rounded net. Add-ons are charged in full, including the purchase month.
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceMonth'
            example:
              month: 2026-10
      responses:
        '200':
          description: Committed result or current snapshot. Identical command retries succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                customer_id: acme
                number: ACME-0001
                month: 2026-10
                customer_name: Acme Inc.
                country: US
                billing_address: 1 Market St, San Francisco, CA 94105
                currency: USD
                lines:
                - kind: usage
                  description: Usage
                  amount_cents: 1200
                  price_version_id: cpu-acme-october
                  metric: cpu_seconds
                  usage_month: 2026-10
                  units: '300000000'
                  gross_ticks: '1200000000'
                  credit_ticks: '1200000000'
                - kind: addon
                  description: concurrency_pack
                  amount_cents: 2000
                  subscription_id: acme-concurrency
                - kind: credit
                  description: Used credit
                  amount_cents: -1200
                total_cents: 2000
                gross_usage_ticks: '1200000000'
                credit_used_ticks: '1200000000'
                issued_at: '2026-11-01T00:00:00Z'
        '400':
          description: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
        '404':
          description: Customer or catalog resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '409':
          description: Operation identity has different content, financial history conflicts, or closing
            is blocked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_conflict
                  message: Operation identity has different content, financial history conflicts, or closing
                    is blocked.
        '413':
          description: Command body exceeds 65536 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Command body exceeds 65536 bytes.
        '415':
          description: Use uncompressed application/json with optional UTF-8 charset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: unsupported_media_type
                  message: Use uncompressed application/json with optional UTF-8 charset.
        '422':
          description: Invalid required field or month that has not ended in UTC. Premature closing
            leaves receipts and financial state unchanged; retry after the month ends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  field: month
                  message: Only completed UTC calendar months can be closed.
        '503':
          description: Database deadline or storage failure. Retry unchanged operation identity and content;
            outcome may be unknown.
          content:
