  /customers/{customer_id}/limit-status:
    get:
      operationId: getCurrentLimitStatus
      tags:
      - Billing
      summary: Read monthly spend limit status
      description: Read the current UTC month selected from the server clock. Compare exact original-month
        gross usage before credit, excluding add-ons. Raising a limit can clear status; a new month selects
        fresh gross spend. All measured usage remains billable after reaching the limit. Pending/error counts
        expose asynchronous freshness and include all committed receipts for the customer. This projection
        does not prove completeness of platform measurements.
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Committed result or current snapshot. Identical command retries succeed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitStatus'
              example:
                customer_id: cyberdyne
                month: 2026-10
                limit_cents: 1500
                gross_charge_ticks: '1817283945'
                limit_reached: true
                state_version: 3
                pending_events: 0
                processing_errors: 0
        '404':
          description: Customer or catalog resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '422':
          description: Invalid customer identifier or UTC month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  message: Use nonblank Unicode without NUL, at most 256 UTF-8 bytes.
                  field: customer_id
        '503':
          description: Database deadline or storage failure. Retry unchanged operation identity and content;
            outcome may be unknown.
          content:
            application/json:
              schema:
