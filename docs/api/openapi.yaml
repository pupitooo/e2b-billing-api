  /customers/{customer_id}/months/{month}/limit-status:
    get:
      operationId: getMonthlyLimitStatus
      tags:
      - Customers
      summary: Get monthly limit status
      description: |
        Check a specified UTC month's processed usage against the currently configured limit.
        Credit and add-ons are excluded; pending/error counts indicate accounting freshness.
        See [limit rules](/architecture/accounting-rules/#utc-months-limits-add-ons-and-late-usage).
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: month
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BillingMonth'
      responses:
        '200':
          description: Requested UTC month usage, current limit status, and accounting freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitStatus'
              example:
                customer_id: cyberdyne
                month: 2026-10
                limit_cents: 1500
                gross_charge_ticks: '1817283945'
                limit_reached: true
                state_version: 3
                pending_events: 0
                processing_errors: 0
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '422':
          description: Invalid customer identifier or UTC month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  message: Use a UTC calendar month as YYYY-MM.
                  field: month
        '503':
          description: Storage unavailable. Retry the read after Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_unavailable
                  message: Database deadline or storage failure. Retry unchanged operation identity and
                    content; outcome may be unknown.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
  /customers/{customer_id}/invoices:
    post:
      operationId: issueMonthlyInvoice
      tags:
      - Customers
      summary: Issue monthly invoice
      description: |
        Close an ended UTC month and issue its immutable invoice using already processed usage.
        Pending usage does not delay closing; retries return the same invoice.
        See [closing order and late usage](/architecture/usage-to-invoice/#invoice-generation-workflow).
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceMonth'
            example:
              month: 2026-10
      responses:
        '200':
          description: Invoice issued, or original immutable invoice returned on retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                customer_id: acme
                number: ACME-0001
                month: 2026-10
                customer_name: Acme Inc.
                country: US
                billing_address: 1 Market St, San Francisco, CA 94105
                currency: USD
                lines:
                - kind: usage
                  description: Usage
                  amount_cents: 1200
                  price_version_id: cpu-acme-october
                  metric: cpu_seconds
                  usage_month: 2026-10
                  units: '300000000'
                  gross_ticks: '1200000000'
                  credit_ticks: '1200000000'
                - kind: addon
                  description: concurrency_pack
                  amount_cents: 2000
                  subscription_id: subscription/acme/concurrency_pack
                - kind: credit
                  description: Used credit
                  amount_cents: -1200
                total_cents: 2000
                gross_usage_ticks: '1200000000'
                credit_used_ticks: '1200000000'
                issued_at: '2026-11-01T00:00:00Z'
        '400':
          description: Invalid or ambiguous JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Invalid JSON, duplicate or unknown fields, incorrect types or integer ranges.
        '404':
          description: Customer does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: not_found
                  message: Customer or catalog resource does not exist.
        '409':
          description: An earlier month must be closed first, or closed history conflicts. No financial changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_conflict
                  message: Operation identity has different content, financial history conflicts, or closing
                    is blocked.
        '413':
          description: Body exceeds 65_536 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_json
                  message: Command body exceeds 65536 bytes.
        '415':
          description: Use uncompressed application/json with optional UTF-8 charset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: unsupported_media_type
                  message: Use uncompressed application/json with optional UTF-8 charset.
        '422':
          description: Invalid request or UTC month has not ended. No financial changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: invalid_command
                  field: month
                  message: Only completed UTC calendar months can be closed.
        '503':
          description: Storage unavailable. Outcome may be unknown; retry unchanged command after Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingError'
              example:
                error:
                  code: billing_unavailable
                  message: Database deadline or storage failure. Retry unchanged operation identity and
                    content; outcome may be unknown.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds.
              schema:
                type: string
                const: '1'
              example: '1'
  /customers/{customer_id}/invoices/{month}:
