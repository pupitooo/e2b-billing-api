      operationId: setSpendLimit
      tags:
      - Billing
      summary: Set or remove the customer spend limit
      description: Supply a nonnegative limit_cents or explicit null for unlimited. Zero is reached even
        without spend. Changes apply immediately under the account lock. Replay of an old unchanged operation
        returns its original command result and does not undo newer configuration; changed identity content
        returns 409. Read status after changing configuration.
      x-implementation-status: implemented
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendLimitChange'
            example:
              operation_id: october-limit
              limit_cents: 1500
      responses:
        '200':
          description: Committed result or current snapshot. Identical command retries succeed.
          content:
