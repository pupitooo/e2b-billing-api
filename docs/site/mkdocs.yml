site_name: E2B Billing
site_description: Billing architecture, operation, and assignment verification
docs_dir: /source
site_dir: /tmp/e2b-docs-site
strict: true
hooks:
  - hooks.py
theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Get started:
      - Local setup: guides/local-development.md
      - Demo guide: guides/demo-console.md
      - Demo console: /demo/
  - Operations:
      - Database: guides/database-operations.md
      - Migrations: guides/migrations.md
      - Configuration: guides/runtime-configuration.md
      - Troubleshooting: guides/troubleshooting.md
      - Recovery: guides/accounting-recovery.md
      - Database browser: /database/
  - API:
      - API guide: guides/api-reference.md
      - API reference: /reference/
  - Billing:
      - Vocabulary: guides/billing-vocabulary.md
      - Financial rules: architecture/accounting-rules.md
      - Data model: architecture/billing-model.md
      - Usage to invoice: architecture/usage-to-invoice.md
      - Processing sequences: architecture/processing-sequences.md
      - Concurrency and locking: architecture/concurrency-and-locking.md
      - Invoice creation: diagrams/invoice-issuance/README.md
  - Simulator:
      - Transport scenarios: simulator/transport-scenarios.md
      - Billing scenarios: simulator/billing-scenarios.md
      - Delayed billing: simulator/delayed-billing.md
      - Scenario format: simulator/scenario-style.md
  - Testing:
      - Tests: guides/testing.md
      - Backend E2E scenarios: guides/e2e-testing.md
      - Manual backend walkthrough: guides/e2e-walkthrough.md
      - Test quality: guides/test-mutation-audit.md
      - Acceptance:
          - Overview: guides/final-acceptance-testing.md
          - Preparation: guides/acceptance/preparation.md
          - Automated checks: guides/acceptance/automated-checks.md
          - Assignment walkthrough: guides/acceptance/assignment.md
          - Final checks: guides/acceptance/final-checks.md
  - Development:
      - Conventions: guides/development.md
      - Documentation: guides/documentation.md
  - Architecture:
      - Overview: architecture/submission-overview.md
      - System contracts:
          - Implemented contracts: architecture/implemented-contracts.md
          - Proposed contracts: architecture/proposed-contracts.md
      - Limitations: architecture/limitations.md
      - Decisions: architecture/decisions.md
      - Design options: brainstorming/architecture-options.md
      - Invoice scheduling proposals: brainstorming/invoice-scheduling.md
      - Capacity: architecture/capacity-and-measurements.md
      - Diagrams: diagrams/index.md
      - Components: diagrams/option-c-components/README.md
